<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medicare SEP Finder</title>
<style>
/* ── Industry design system (tokens + components) ─────────────────────── */
@import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&family=Barlow+Condensed:wght@400;600&display=swap');

:root {
  --color-bg: #f2f2f3;
  --color-surface: #e9e9ea;
  --color-text: #1d1f20;
  --color-accent: #5980a6;
  --color-accent-2: #728fab;
  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);

  --color-neutral-100: #f5f5f8;
  --color-neutral-200: #e7e7ea;
  --color-neutral-300: #d4d4d7;
  --color-neutral-400: #b7b7ba;
  --color-neutral-500: #98989b;
  --color-neutral-600: #7a7a7d;
  --color-neutral-700: #5d5d60;
  --color-neutral-800: #424244;
  --color-neutral-900: #2b2b2d;

  --color-accent-100: #eef6ff;
  --color-accent-200: #d6ebff;
  --color-accent-300: #b5d9fd;
  --color-accent-400: #94bce3;
  --color-accent-500: #749dc4;
  --color-accent-600: #597ea3;
  --color-accent-700: #416180;
  --color-accent-800: #2c455d;
  --color-accent-900: #1d2d3d;

  --font-heading: "Barlow Condensed", system-ui, sans-serif;
  --font-heading-weight: 600;
  --font-body: "Barlow", system-ui, sans-serif;

  --space-1: 3.4px; --space-2: 6.8px; --space-3: 10.2px;
  --space-4: 13.6px; --space-6: 20.4px; --space-8: 27.2px;
  --radius-sm: 2px; --radius-md: 4px; --radius-lg: 7px;

  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);
  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);
  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); font-size: 15px; line-height: 1.55; font-weight: 400; }
h1, h2, h3, h4, h5, h6 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2); }
h1 { font-size: 42px; } h2 { font-size: 32px; } h3 { font-size: 25px; }
h4 { font-size: 20px; } h5 { font-size: 16px; }
h6 { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
p { margin: 0 0 var(--space-3); }
a { color: var(--color-accent-700); text-underline-offset: 3px; }
a:hover { color: var(--color-accent-800); }
img { display: block; max-width: 100%; }
.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }

.blueprint { position: relative; border: 1px solid var(--color-divider); border-radius: 0; }
.blueprint > .corner { position: absolute; width: 11px; height: 11px; color: color-mix(in srgb, var(--color-text) 55%, transparent); }
.blueprint > .corner::before, .blueprint > .corner::after { content: ""; position: absolute; background: currentColor; }
.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }
.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }
.blueprint > .corner.tl { top: -6px; left: -6px; }
.blueprint > .corner.tr { top: -6px; right: -6px; }
.blueprint > .corner.bl { bottom: -6px; left: -6px; }
.blueprint > .corner.br { bottom: -6px; right: -6px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; text-decoration: none;
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 14px; line-height: 1.2; color: var(--color-text);
  background: transparent; border: 1px solid var(--color-divider);
  padding: var(--space-2) calc(var(--space-3) * 1.2);
  border-radius: 0;
}
.btn svg { display: block; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--color-accent); color: var(--color-bg); border-color: var(--color-accent); }
.btn-primary:hover:not(:disabled) { background: var(--color-accent-600); }
.btn-primary:active:not(:disabled) { background: var(--color-accent-700); }
.btn-secondary { border-color: var(--color-divider); }
.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }

.field > label { display: block; font-size: 12px; margin-bottom: 5px; color: color-mix(in srgb, var(--color-text) 70%, transparent); }
.input {
  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;
  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);
  background: var(--color-surface);
  border: 1px solid var(--color-divider); border-radius: 0;
}
.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }

.seg { display: inline-flex; overflow: hidden; border: 1px solid var(--color-divider); border-radius: 0; }
.seg-opt { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
.seg-opt input { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }
.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }
.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }
.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }

.tag { display: inline-flex; align-items: center; font-size: 11px; letter-spacing: 0.02em; padding: 3px 10px; border-radius: 0; }
.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }

/* ── page-specific (from the design's helmet) ─────────────────────────── */
.sp { overflow-y: auto; scrollbar-width: none; }
.sp::-webkit-scrollbar { display: none; }
@keyframes blink { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
@keyframes rise { from { transform: translateY(14px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }
@keyframes sheetup { from { transform: translateY(100%) } to { transform: translateY(0) } }

/* ── variant / data-source controls under the device frame ────────────── */
.ctl { display: flex; gap: 18px; align-items: center; justify-content: center; flex-wrap: wrap; font-size: 12px; color: var(--color-neutral-700); }
.ctl label { display: flex; gap: 7px; align-items: center; letter-spacing: .06em; text-transform: uppercase; font-size: 10px; }
.ctl select { font: inherit; font-size: 12px; padding: 4px 8px; background: var(--color-surface); color: var(--color-text); border: 1px solid var(--color-divider); border-radius: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script src="./sep-core.js"></script>
<script>
'use strict';
(() => {

/* All rule logic, questionnaire definitions, CMS source metadata, and date
   math live in sep-core.js (shared with the node test suite). This file is
   only state, data fetching, and rendering. */
const {fmt,short,monthEnd,monthStart,days,todayISO,
  SOURCES,CMS_REF,CMS_URL,CMS_VERSION,PLANS,RULES_VERIFIED,
  stateFromZip,normCounty,EMPTY_EVENT,DEMO_EVENT,winEnd,winLabel,buildEvents,
  DQ,evaluateDQ,RULES,RULE,SCREEN_RULES,computeResults}=window.SEPCore;
const oqList=a=>window.SEPCore.oqList(a||S.oqA);
const moveWindow=()=>window.SEPCore.moveWindow(S.oqA,S.date);

/* ═══════════════════════════ app state ═══════════════════════════════════ */

const params=new URLSearchParams(location.search);
let HERO=['field','plate','timeline'].includes(params.get('hero'))?params.get('hero'):'field';
let MODE=['live','demoDisaster','demoNone'].includes(params.get('mode'))?params.get('mode'):'live';

const S={screen:'dash',zip:'',date:todayISO(),customDate:false,scan:0,geo:null,events:null,geoErr:null,geoErrTitle:null,dq:0,dqA:{},oq:0,oqA:{},draft:'',sheet:null,panel:null,checks:{},discOpen:false,countyInput:'',cands:[],candsZip:'',candsLoading:false,autoNext:false,srcHealth:{}};
const MOBILE=window.matchMedia('(max-width:600px)');
(MOBILE.addEventListener?MOBILE.addEventListener.bind(MOBILE):MOBILE.addListener.bind(MOBILE))('change',()=>render());
function setState(patch){Object.assign(S,patch);render()}

function setParam(k,val){params.set(k,val);history.replaceState(null,'',`${location.pathname}?${params}`)}

const geo=()=>S.geo||{city:'',county:'',state:stateFromZip(S.zip)||'',fips:''};
const geoLine=()=>{const g=geo();return [g.city,g.county,g.state].filter(Boolean).join(', ')||'Geography not resolved'};
const ev=()=>{if(MODE==='demoNone')return null;
  if(MODE==='demoDisaster')return DEMO_EVENT;
  const l=S.events;return l&&l.length?l[0]:null};

/* The county the agent typed or picked, matched against the suggestions
   fetched for this ZIP. Only a matched county carries a FIPS the scan can
   use directly. */
const matchedCand=()=>{const t=normCounty(S.countyInput);if(!t)return null;
  return (S.cands||[]).find(c=>normCounty(c.name)===t)||null};

/* Suggest counties for a valid ZIP: each distinct Zippopotam place
   coordinate is resolved to a county via the FCC Census Area API, then
   deduped by FIPS. County stays optional — this only feeds suggestions. */
let candsToken=0;
async function requestCands(zip){
  const tok=++candsToken;
  if(!/^\d{5}$/.test(zip)){if(S.cands.length||S.candsLoading)setState({cands:[],candsZip:'',candsLoading:false});return}
  if(S.candsZip===zip&&(S.cands.length||S.candsLoading))return;
  if(MODE!=='live'){setState({cands:[{name:'Travis County',fips:'48453'}],candsZip:zip,candsLoading:false});return}
  setState({cands:[],candsZip:zip,candsLoading:true});
  try{
    const zr=await fetch(`https://api.zippopotam.us/us/${zip}`);
    if(!zr.ok)throw new Error();
    const zj=await zr.json();
    const seenC=new Set(),coords=[];
    (zj.places||[]).forEach(p=>{const k=`${p.latitude},${p.longitude}`;if(!seenC.has(k)){seenC.add(k);coords.push(p)}});
    const out=[],seenF=new Set();
    await Promise.all(coords.slice(0,4).map(async p=>{
      try{
        const fr=await fetch(`https://geo.fcc.gov/api/census/area?lat=${p.latitude}&lon=${p.longitude}&censusYear=2020&format=json`);
        const fj=await fr.json(),a=(fj.results||[])[0]||{};
        let cn=a.county_name||'';
        if(cn&&!/(county|parish|borough|municipality|census area|city|district|island|municipio)$/i.test(cn))cn=`${cn} County`;
        if(cn&&a.county_fips&&!seenF.has(a.county_fips)){seenF.add(a.county_fips);out.push({name:cn,fips:a.county_fips})}
      }catch(e){}
    }));
    if(tok!==candsToken)return;
    setState({cands:out,candsLoading:false});
  }catch(e){if(tok===candsToken)setState({cands:[],candsLoading:false})}
}

/* ── live geography + declaration search ──────────────────────────────────
   ZIP → city/state/coords (Zippopotam), coords → county + FIPS (FCC Census
   Area API), county FIPS → federal declarations (FEMA OpenFEMA v2). All 50
   states, real counties, real incident periods. The CMS window is then
   computed here, deterministically, from the stored rule. */
/* Recent searches — real history, persisted locally. Only ZIP, resolved
   place, timestamp, and result count are stored (no beneficiary data). */
const RKEY='sepfinder.recents.v1';
function loadRecents(){try{const a=JSON.parse(localStorage.getItem(RKEY));return Array.isArray(a)?a:[]}catch(e){return[]}}
function saveRecent(r){const a=loadRecents().filter(x=>x.zip!==r.zip);a.unshift(r);
  try{localStorage.setItem(RKEY,JSON.stringify(a.slice(0,5)))}catch(e){}}

/* Auto-advance: the workflow continues to the next stage on its own after a
   brief pause. Any navigation (back, CTA) invalidates the pending timer. */
let autoToken=0;
function autoAdvance(from,ms,patch){const tok=++autoToken;
  setTimeout(()=>{if(tok===autoToken&&S.screen===from&&S.autoNext)setState({autoNext:false,...patch})},ms)}
function enterNoDisaster(){setState({screen:'nodisaster',autoNext:true});
  autoAdvance('nodisaster',3000,{screen:'oq',oq:0,draft:''})}

/* Live-source health check for the Sources panel: verifies the three data
   feeds actually respond right now. Read-only, tiny queries. */
async function checkSources(){
  setState({srcHealth:{...S.srcHealth,checking:true}});
  const checks={zippo:`${SOURCES.zippo.api}78701`,
    census:`${SOURCES.census.api}?lat=30.2713&lon=-97.7426&censusYear=2020&format=json`,
    fema:`${SOURCES.fema.api}?$top=1&$format=json`};
  const out={};
  await Promise.all(Object.entries(checks).map(async([id,url])=>{
    try{const r=await fetch(url);out[id]=r.ok?'ok':'fail'}catch(e){out[id]='fail'}}));
  out.when=new Date().toLocaleTimeString();
  setState({srcHealth:out});
}

let scanToken=0;
async function startScan(){
  const zip=S.zip,searchDate=S.date,tok=++scanToken;
  const cand=matchedCand(),typed=S.countyInput.trim();
  const live=()=>tok===scanToken;
  const fail=(title,msg)=>{if(live())setState({geoErrTitle:title,geoErr:msg,screen:'scanerr'})};
  setState({screen:'scan',scan:0,geo:null,events:null,geoErr:null,geoErrTitle:null});
  if(MODE!=='live'){
    [1,2,3,4,5].forEach(i=>setTimeout(()=>{if(!live())return;
      if(i<5)setState({scan:i});
      else{setState({geo:{city:'Austin',county:'Travis County',state:'TX',fips:'48453',src:cand?'agent':'zip'}});
        if(MODE==='demoDisaster')setState({screen:'primary'});else enterNoDisaster();}},320*i));
    return}
  let zj;
  try{
    const zr=await fetch(`https://api.zippopotam.us/us/${zip}`);
    if(!zr.ok)throw new Error('ZIP code not found in the USPS ZIP file.');
    zj=await zr.json();
  }catch(err){
    return fail('Geography lookup could not be completed',
      err.message==='ZIP code not found in the USPS ZIP file.'?err.message:
      'The ZIP directory could not be reached. Check the connection and try again — no disaster SEP determination was made.')}
  const p=zj.places[0];
  const city=p['place name'],st=p['state abbreviation'],lat=p.latitude,lon=p.longitude;
  if(!live())return;
  setState({scan:1,geo:{city,county:'',state:st,fips:'',src:'zip'}});
  let county='',fips='',src='zip',note='';
  if(cand){
    /* Agent-confirmed county: use its FIPS directly, no coordinate lookup. */
    county=cand.name;fips=cand.fips;src='agent';
  }else{
    try{
      const fr=await fetch(`https://geo.fcc.gov/api/census/area?lat=${lat}&lon=${lon}&censusYear=2020&format=json`);
      const fj=await fr.json(),a=(fj.results||[])[0]||{};
      const cn=a.county_name||'';
      county=cn&&!/(county|parish|borough|municipality|census area|city|district|island|municipio)$/i.test(cn)?`${cn} County`:cn;
      fips=a.county_fips||'';
    }catch(e){}
    if(typed&&county&&normCounty(typed)!==normCounty(county))note=`Entered county “${typed}” could not be verified for this ZIP — using ${county}.`;
  }
  if(!live())return;
  const geoObj={city,county,state:st,fips,src,note};
  setState({scan:2,geo:geoObj});
  /* Fail safe: without a resolved county FIPS the declaration search cannot
     run — never present that as "no disaster SEP". */
  if(!fips)return fail('County could not be resolved',
    'The county for this ZIP could not be determined, so federal declarations could not be searched. Confirm the county (the optional field on the search screen) and try again — no disaster SEP determination was made.');
  let events;
  try{
    const since=monthStart(searchDate,-30);
    const filter=`fipsStateCode eq '${fips.slice(0,2)}' and fipsCountyCode eq '${fips.slice(2)}' and incidentBeginDate ge '${since}T00:00:00.000z'`;
    const dr=await fetch(`https://www.fema.gov/api/open/v2/DisasterDeclarationsSummaries?$filter=${encodeURIComponent(filter)}&$orderby=declarationDate desc&$top=60&$format=json`);
    if(!dr.ok)throw new Error('FEMA responded with an error.');
    const dj=await dr.json();
    events=buildEvents(dj.DisasterDeclarationsSummaries||[],searchDate);
  }catch(err){
    return fail('Declaration search unavailable',
      'FEMA OpenFEMA could not be reached, so declarations for this county could not be searched. Try again, or continue to client SEP screening — no disaster SEP determination was made.')}
  if(!live())return;
  saveRecent({zip,place:[city,county,st].filter(Boolean).join(', '),when:Date.now(),
    found:events.length?`${events.length} EVENT${events.length>1?'S':''}`:'NO DISASTER'});
  setState({scan:4,geo:geoObj,events});
  setTimeout(()=>{if(!live())return;
    if(events.length)setState({screen:'primary'});else enterNoDisaster()},420);
}

/* Result assembly is delegated to the rule engine in sep-core.js. */
const results=()=>computeResults({event:ev(),hasEvent:!!ev(),dqA:S.dqA,oqA:S.oqA,searchDate:S.date});
const firstUnansweredOQ=()=>{const L=oqList();const i=L.findIndex(q=>S.oqA[q.id]===undefined);return i<0?0:i};

function sheetData(id){const a=S.oqA,d=S.dqA,E=ev()||EMPTY_EVENT,g=geo();
  if(id==='disaster')return{name:'Disaster / Emergency SEP',ref:E.ref,code:'Reason code requires verification',plans:E.plans,version:E.version,verified:fmt(E.verified),url:E.url,blocks:[
    {title:'Qualifying event',text:`${E.name}. Declared ${fmt(E.declared)}; incident period ${fmt(E.start)} – ${E.end?fmt(E.end):'open (not yet closed by the declaring authority)'}.`},
    {title:'Client input used',lines:[`ZIP ${S.zip} resolves to ${g.county||'—'}, ${g.state||'—'} (county FIPS ${g.fips||'—'})${g.src==='agent'?' — county confirmed by the agent':''} — inside the designated area.`,`Resided in or received care in the affected area: ${d.reside||'—'}.`,`Another election period was open during the incident period: ${d.other||'—'}.`,`Missed that election because of the disaster: ${d.missed||'—'}.`,`Already used this disaster SEP: ${d.used||'—'}.`]},
    {title:'CMS rule used',text:'The disaster/emergency SEP is available to an individual who was eligible for another election period at the time of the incident, did not make an election because of the disaster, resided (or their decision-maker resided) in the affected area, and has not already used the SEP for this incident.'},
    {title:'How the window was calculated',lines:[`Start = incident start date (${fmt(E.start)}).`,
      E.end?`End = last day of the second full calendar month after the incident end date (${fmt(E.end)} → ${fmt(winEnd(E))}).`:'End = not yet determinable: the declaring authority has not published an incident end date, so the window stays open until it does.',
      E.end?(days(S.date,winEnd(E))===0?`The window closes today (${fmt(S.date)} search date).`:`${days(S.date,winEnd(E))} days remain as of the ${fmt(S.date)} search date.`):`Re-check this event before each submission — the end date sets the deadline.`,
      `Possible effective date: ${RULE('disaster').effective}`]},
    {title:'Assumptions',lines:[`Declaration record read live from FEMA OpenFEMA v2 for county FIPS ${g.fips||'—'}; the published incident end date is treated as the incident end date.`,
      g.src==='agent'?'The county was confirmed by the agent; client residence is still inferred from the entered ZIP and county, not from a verified address of record.':'Client residence is inferred from the ZIP code the agent entered, not from a verified address of record.',
      ...(g.note?[g.note]:[]),
      'State- and locally-declared emergencies are not in this federal dataset — check them separately for this county.']},
    {title:'Still requires verification',lines:['Election / reason code — not confirmed from an authoritative CMS source for this build.','Whether the declaring authority has extended the incident period.','That the receiving plan accepts the SEP and effective date requested.']}]};
  const mvW=id==='move'?moveWindow():null;
  if(id==='move'&&mvW){const w=mvW;
    return{name:'SEP — Permanent Change of Residence',ref:'§30.6.20 — Change in Residence',code:'Reason code requires verification',plans:'MA • MA-PD • PDP',version:CMS_VERSION,verified:fmt(RULES_VERIFIED),url:CMS_URL,blocks:[
      {title:'Qualifying event',text:`Permanent change in residence on ${fmt(w.md)} — ZIP ${a.prevZip||'—'} to ZIP ${a.newZip||'—'}.`},
      {title:'Client input used',lines:[`Permanent move reported: Yes.`,`Date of move: ${fmt(w.md)}.`,`Coverage before the move: ${a.hadCoverage||'—'}.`,`Plan notified in advance: ${a.notified||'—'}.`]},
      {title:'CMS rule used',text:'A permanent move out of the plan’s service area, or to an area where new plan options are available, provides an SEP. The window depends on whether the individual notified the plan before or after the move.'},
      {title:'How the window was calculated',lines:[a.notified==='Yes, before moving'?`Advance notice: window opens the month before the move (${fmt(w.start)}).`:`Notice given after the move: window opens the month the plan is notified (${fmt(w.start)}).`,`Window ends the last day of the second full month after ${a.notified==='Yes, before moving'?'the move':'notification'} (${fmt(w.end)}).`,'Possible effective date: first of the month following the election, or up to three months later at the client’s choice.']},
      {title:'Assumptions',lines:['The new ZIP code is outside the current plan’s service area — confirm against the current CMS service-area dataset.','The move is permanent, not a temporary absence.']},
      {title:'Still requires verification',lines:['Election / reason code — not confirmed from an authoritative CMS source for this build.','Documented notification date with the outgoing plan.','Whether the client remains enrolled in a plan that covers the new address in the interim.']}]}}
  const m=results().maybe.find(x=>x.id===id)||{name:'SEP',ref:'—',version:CMS_VERSION};
  const rule=RULE(id);
  const trigQ=rule&&rule.trigger?oqList(a).find(q=>q.id===rule.trigger):null;
  const trigLine=`Screening answer — ${trigQ?trigQ.title:(rule?rule.name:'—')} ${a&&rule&&rule.trigger?`“${a[rule.trigger]||'—'}”`:'—'}.`;
  return{name:m.name,ref:(rule&&rule.ref)||m.ref,code:'Reason code requires verification',plans:(rule&&rule.plans)||'Requires verification',version:m.version,verified:fmt(RULES_VERIFIED),url:CMS_URL,blocks:[
    {title:'Why this appears',text:m.needs},
    ...(rule&&rule.plain?[{title:'What this SEP is',text:rule.plain}]:[]),
    {title:'Client input used',lines:[trigLine]},
    {title:'Status',text:'Not enough information to state a window. The rule engine will not calculate an election window until the required inputs are present.'},
    {title:'Still requires verification',lines:['Election / reason code — not confirmed from an authoritative CMS source for this build.','The inputs listed above, confirmed with the plan or the state agency.']}]}}

function pickDQ(v){const q=DQ[S.dq];const dqA={...S.dqA,[q.id]:v};

function h(tag,attrs,...kids){
  const n=document.createElement(tag);
  if(attrs)for(const[k,val]of Object.entries(attrs)){
    if(val==null||val===false)continue;
    if(k==='style')n.style.cssText=val;
    else if(k==='class')n.className=val;
    else if(k==='dataKey')n.dataset.key=val;
    else if(k.startsWith('on'))n.addEventListener(k.slice(2).toLowerCase(),val);
    else if(k==='disabled'||k==='checked'||k==='value')n[k]=val;
    else n.setAttribute(k,val);
  }
  for(const kid of kids.flat(Infinity)){
    if(kid==null||kid===false)continue;
    n.append(kid.nodeType?kid:document.createTextNode(kid));
  }
  return n;
}

      v.verifyItems.map(vi=>h('button',{style:'display:flex;gap:10px;align-items:flex-start;padding:8px 0;min-height:44px;background:transparent;border:0;cursor:pointer;font:inherit;text-align:left;width:100%',onClick:vi.toggle},
        h('span',{style:`flex:none;width:18px;height:18px;margin-top:1px;border:1.5px solid var(--color-accent);background:${vi.fill};color:#f2f2f3;font-size:12px;line-height:15px;text-align:center`},vi.mark),
        h('span',{style:'flex:1;font-size:13px;line-height:1.4'},vi.label)))));
}

function sheet(v){
  return h('div',{style:'position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;justify-content:flex-end;background:color-mix(in srgb,var(--color-neutral-900) 45%,transparent)'},
    h('div',{style:'position:absolute;inset:0',onClick:v.closeSheet}),
    h('div',{class:'sp',style:'position:relative;max-height:82%;background:var(--color-bg);border-top:2px solid var(--color-text);animation:sheetup .28s ease;padding:0 20px 30px'},
      h('div',{style:'position:sticky;top:0;background:var(--color-bg);padding:16px 0 12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:1px solid var(--color-divider);z-index:1'},
        h('div',null,
          h('div',{style:'font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--color-accent-700)'},'Why does this apply?'),
          h('div',{style:'font-family:var(--font-heading);font-weight:600;font-size:23px;line-height:1.1;margin-top:3px'},v.sheetName)),
        h('button',{class:'btn btn-secondary',style:'flex:none;width:44px;height:44px;padding:0;font-size:16px',onClick:v.closeSheet},'✕')),
      h('div',{style:'display:flex;flex-direction:column;gap:18px;padding-top:16px'},
        v.sheetBlocks.map(b=>h('div',{style:'display:flex;flex-direction:column;gap:7px'},
          h('h6',{style:`margin:0;color:${mut(60)}`},b.title),
          b.text&&h('div',{style:'font-size:13.5px;line-height:1.55'},b.text),
          b.lines.map(l=>h('div',{style:'display:flex;gap:9px;font-size:13px;line-height:1.5'},
            h('span',{style:'flex:none;width:5px;height:5px;margin-top:7px;background:var(--color-accent)'}),
            h('span',{style:'flex:1'},l))))),
        h('div',{class:'blueprint',style:'padding:13px;display:flex;flex-direction:column;gap:7px'},corners(),
          [['CMS reference',v.sheetRef,null],['Election / reason code',v.sheetCode,'#8a6a2b'],['Applies to',v.sheetPlans,null],['Source version',v.sheetVersion,null],['Last verified',v.sheetVerified,null]].map(([k,val,c])=>
            h('div',{style:'display:flex;justify-content:space-between;gap:10px;font-size:12px'},
              h('span',{style:`color:${mut(55)}`},k),
              h('span',{style:`text-align:right${c?`;color:${c}`:''}`},val))),
          h('a',{href:v.sheetUrl,target:'_blank',rel:'noopener',style:'font-size:12px;margin-top:2px'},'Open authoritative CMS source ↗')),
        h('div',{style:`font-size:11px;line-height:1.5;color:${mut(52)}`},`Explanation generated from the stored rule record — not from a language model. ${v.disclaimerShort}`))));
}

/* Library / Sources panels — read-only views of the rule registry and the
   data-source metadata in sep-core.js. */
function panelSheet(v){
  const isLib=v.panel==='library';
  return h('div',{style:'position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;justify-content:flex-end;background:color-mix(in srgb,var(--color-neutral-900) 45%,transparent)'},
    h('div',{style:'position:absolute;inset:0',onClick:v.closePanel}),
    h('div',{class:'sp',style:'position:relative;max-height:82%;background:var(--color-bg);border-top:2px solid var(--color-text);animation:sheetup .28s ease;padding:0 20px 30px'},
      h('div',{style:'position:sticky;top:0;background:var(--color-bg);padding:16px 0 12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:1px solid var(--color-divider);z-index:1'},
        h('div',null,
          h('div',{style:'font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--color-accent-700)'},isLib?'Reference':'Data'),
          h('div',{style:'font-family:var(--font-heading);font-weight:600;font-size:23px;line-height:1.1;margin-top:3px'},isLib?'SEP rule library':'Data sources')),
        h('button',{class:'btn btn-secondary',style:'flex:none;width:44px;height:44px;padding:0;font-size:16px',onClick:v.closePanel},'✕')),
      h('div',{style:'display:flex;flex-direction:column;gap:14px;padding-top:16px'},
        isLib
          ?[h('div',{style:`font-size:12px;line-height:1.5;color:${mut(60)}`},`${v.ruleCount} rules from ${CMS_VERSION}. No CMS election/reason code is stored for any rule in this build — every code requires verification with the receiving plan.`),
            v.libraryRules.map(r=>h('div',{class:'blueprint',style:'padding:13px;display:flex;flex-direction:column;gap:6px'},corners(),
              h('div',{style:'display:flex;justify-content:space-between;gap:8px;align-items:flex-start'},
                h('span',{style:'font-family:var(--font-heading);font-weight:600;font-size:16px;line-height:1.15'},r.name),
                h('span',{style:'flex:none;font-size:10px;letter-spacing:.06em;padding:3px 8px;background:var(--color-accent-100);color:var(--color-accent-800)'},r.status.toUpperCase())),
              h('div',{style:'font-size:12px;line-height:1.5'},r.plain),
              h('div',{style:`font-size:11px;color:${mut(55)}`},`${r.ref} · ${r.plans}${r.geographic?' · geography-dependent':''} · Reason code requires verification`)))]
          :[h('div',{style:`font-size:12px;line-height:1.5;color:${mut(60)}`},'Sources feeding this tool. Live feeds are queried at search time; the CMS guidance rules are stored with the version and verification dates below. Rule changes require a new reviewed build — nothing updates rule logic silently.'),
            v.sourcesList.map(x=>h('div',{class:'blueprint',style:'padding:13px;display:flex;flex-direction:column;gap:6px'},corners(),
              h('div',{style:'display:flex;justify-content:space-between;gap:8px;align-items:flex-start'},
                h('span',{style:'font-family:var(--font-heading);font-weight:600;font-size:15px;line-height:1.2'},x.name),
                x.health&&h('span',{style:`flex:none;font-size:10px;letter-spacing:.06em;padding:3px 8px;background:${x.health==='ok'?'#3d7a63':'#8a6a2b'};color:#f2f2f3`},x.health==='ok'?'REACHABLE':'UNREACHABLE')),
              h('div',{style:`font-size:11px;line-height:1.5;color:${mut(55)}`},`Version: ${x.version} · Last checked: ${x.lastChecked} · Last verified: ${x.lastVerified}`),
              h('a',{href:x.url,target:'_blank',rel:'noopener',style:'font-size:12px'},'Open source ↗'))),
            h('button',{class:'btn btn-secondary',style:'min-height:48px;width:100%',onClick:v.checkSources},v.srcCheckedAt?`CHECK LIVE SOURCES AGAIN (last: ${v.srcCheckedAt})`:'CHECK LIVE SOURCES NOW')])));
}

/* ═══════════════════════════ chrome: header / footer / device ════════════ */

function header(v){
  return h('div',{style:`flex:none;padding:${v.framed?'56px':'22px'} 20px 12px;display:flex;align-items:flex-end;gap:10px;border-bottom:1px solid var(--color-divider)`},
    h('div',{style:'flex:1;display:flex;flex-direction:column;gap:2px'},
      h('div',{style:'font-family:var(--font-heading);font-weight:600;font-size:19px;letter-spacing:.02em;line-height:1'},'MEDICARE SEP FINDER'),
      h('div',{style:`font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:${mut(50)}`},v.crumb)),
    h('div',{style:`font-size:11px;text-align:right;line-height:1.35;color:${mut(50)}`},'Search date',h('br'),h('span',{style:'color:var(--color-text)'},v.dateLabel)));
}

function footer(v){
  return h('div',{style:'flex:none;border-top:1px solid var(--color-divider);background:var(--color-bg)'},
    h('button',{style:'display:flex;gap:8px;align-items:flex-start;width:100%;padding:9px 20px 0;background:transparent;border:0;cursor:pointer;font:inherit;text-align:left',onClick:v.toggleDisclaimer},
      h('span',{style:'flex:none;width:6px;height:6px;margin-top:6px;background:var(--color-accent)'}),
      h('span',{style:'flex:1;font-size:12px;line-height:1.45;color:var(--color-neutral-800)'},v.disclaimer)),
    h('div',{style:'padding:10px 20px 30px;display:flex;gap:10px'},
      v.showBack&&h('button',{class:'btn btn-secondary',style:'min-height:56px;flex:none;width:56px;font-size:18px',onClick:v.back},'‹'),
      h('button',{class:'btn btn-primary',style:'min-height:56px;flex:1;font-size:16px;letter-spacing:.04em',disabled:v.ctaDisabled,onClick:v.cta},v.ctaLabel)),
    v.hasSecondary&&h('div',{style:'padding:0 20px 22px;margin-top:-22px'},
      h('button',{class:'btn btn-secondary',style:'min-height:50px;width:100%;font-size:14px',onClick:v.secondary},v.secondaryLabel)));
}

function appRoot(v){
  let content;
  if(v.isDash)content=screenDash(v);
  else if(v.isSearch)content=screenSearch(v);
  else if(v.isScan)content=screenScan(v);
  else if(v.isScanErr)content=screenScanErr(v);
  else if(v.isPrimary)content=screenPrimary(v);
  else if(v.isNoDisaster)content=screenNoDisaster(v);
  else if(v.isDqBridge)content=screenDqBridge(v);
  else if(v.isQuestion)content=screenQuestion(v);
  else if(v.isResults)content=screenResults(v);
  return h('div',{style:'position:relative;height:100%;display:flex;flex-direction:column;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:15px'},
    header(v),
    h('div',{class:'sp',style:'flex:1;padding:20px'},content,h('div',{style:'height:12px'})),
    footer(v),
    v.sheetOpen&&sheet(v),
    v.panel&&panelSheet(v));
}

/* iOS 26 device frame — ported from the design system's ios-frame.jsx. */
function statusBar(){
  const c='#000';
  return h('div',{style:'display:flex;gap:154px;align-items:center;justify-content:center;padding:21px 24px 19px;position:relative;z-index:20;width:100%'},
    h('div',{style:'flex:1;height:22px;display:flex;align-items:center;justify-content:center;padding-top:1.5px'},
      h('span',{style:'font-family:-apple-system,"SF Pro",system-ui;font-weight:590;font-size:17px;line-height:22px;color:#000'},'9:41')),
    h('div',{style:'flex:1;height:22px;display:flex;align-items:center;justify-content:center;gap:7px;padding-top:1px;padding-right:1px'},
      svg(`<svg width="19" height="12" viewBox="0 0 19 12"><rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill="${c}"/><rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill="${c}"/><rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill="${c}"/><rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill="${c}"/></svg>`),
      svg(`<svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill="${c}"/><path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill="${c}"/><circle cx="8.5" cy="10.5" r="1.5" fill="${c}"/></svg>`),
      svg(`<svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke="${c}" stroke-opacity="0.35" fill="none"/><rect x="2" y="2" width="20" height="9" rx="2" fill="${c}"/><path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill="${c}" fill-opacity="0.4"/></svg>`)));
}

function device(v){
  return h('div',{style:'width:440px;height:956px;border-radius:48px;overflow:hidden;position:relative;background:#F2F2F7;box-shadow:0 40px 80px rgba(0,0,0,0.18),0 0 0 1px rgba(0,0,0,0.12);font-family:-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;flex:none'},
    h('div',{style:'position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;border-radius:24px;background:#000;z-index:50'}),
    h('div',{style:'position:absolute;top:0;left:0;right:0;z-index:10;pointer-events:none'},statusBar()),
    h('div',{style:'height:100%;display:flex;flex-direction:column'},
      h('div',{style:'flex:1;overflow:auto'},appRoot(v))),
    h('div',{style:'position:absolute;bottom:0;left:0;right:0;z-index:60;height:34px;display:flex;justify-content:center;align-items:flex-end;padding-bottom:8px;pointer-events:none'},
      h('div',{style:'width:139px;height:5px;border-radius:100px;background:rgba(0,0,0,0.25)'})));
}

/* Design-time props (heroVariant / dataMode), exposed as page controls. */
function controls(){
  const sel=(label,val,opts,onchange)=>h('label',null,label,
    h('select',{onChange:e=>onchange(e.target.value)},
      opts.map(o=>h('option',{value:o,selected:o===val?'':null},o))));
  return h('div',{class:'ctl'},
    sel('Primary SEP option',HERO,['field','plate','timeline'],val=>{HERO=val;setParam('hero',val);render()}),
    sel('Data source',MODE,['live','demoDisaster','demoNone'],val=>{MODE=val;setParam('mode',val);render()}));
}

/* ═══════════════════════════ render loop ═════════════════════════════════ */

const root=document.getElementById('root');
function render(){
  const active=document.activeElement;
  const key=active&&active.dataset?active.dataset.key:null;
  const selPos=key&&active.selectionStart!=null?[active.selectionStart,active.selectionEnd]:null;
  const v=computeVals();
  /* On phones, render the app full-viewport with no device bezel; the
     framed presentation is for desktop preview. */
  root.replaceChildren(MOBILE.matches
    ?h('div',{style:'height:100dvh;display:flex;flex-direction:column;background:var(--color-bg)'},appRoot(v))
    :h('div',{style:'min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:20px;padding:44px 24px;background:var(--color-bg)'},
      device(v),controls()));
  if(key){const el2=root.querySelector(`[data-key="${key}"]`);
    if(el2){el2.focus({preventScroll:true});
      if(selPos&&el2.setSelectionRange)try{el2.setSelectionRange(selPos[0],selPos[1])}catch(e){}}}
}
render();

})();
</script>
